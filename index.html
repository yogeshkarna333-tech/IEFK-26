<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IEFK ’26 Countdown</title>
<style>
body {
  font-family: Century Gothic, sans-serif;
  text-align: center;
  color: #0b2b1f;
  padding-top: 60px;

  background-image: url('background02.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  min-height: 100vh;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.75);
  z-index: -1;
}

#timer {
  font-size: 42px;
  margin-top: 30px;
  background: rgba(0,0,0,0.7);
  color: white;
  display: inline-block;
  padding: 15px 25px;
  border-radius: 12px;
}

h1 {
  background: rgba(255,255,255,0.8);
  display: inline-block;
  padding: 10px 20px;
  border-radius: 10px;
}

.small {
  font-size: 18px;
  margin-top: 10px;
  background: rgba(255,255,255,0.8);
  display: inline-block;
  padding: 6px 14px;
  border-radius: 8px;
}
</style>
</head>

<body>

<h1>IEFK ’26 Countdown</h1>
<div class="small">Program starts: 07 Feb 2026 | 09:00 AM IST</div>

<div id="timer"></div>

<script>
const target = new Date("2026-02-07T09:00:00+05:30").getTime();

setInterval(function() {
  const now = new Date().getTime();
  const diff = target - now;

  const d = Math.floor(diff / (1000*60*60*24));
  const h = Math.floor((diff % (1000*60*60*24))/(1000*60*60));
  const m = Math.floor((diff % (1000*60*60))/(1000*60));
  const s = Math.floor((diff % (1000*60))/1000);

  document.getElementById("timer").innerHTML =
    d + " Days  " + h + " Hours  " + m + " Minutes  " + s + " Seconds";

},1000);
</script>

</body>
</html>
