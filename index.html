<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IEFK ’26 Countdown</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: "Century Gothic", "Futura", "Trebuchet MS", Arial, sans-serif;
  background-image: url('background02.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* soft overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.78);
  z-index: -1;
}

.container {
  text-align: center;
  padding: 24px;
}

/* Main Title */
h1 {
  font-size: 40px;
  font-weight: 800;
  margin-bottom: 12px;
  background: rgba(255,255,255,0.9);
  padding: 14px 28px;
  border-radius: 14px;
  display: inline-block;
}

/* Subtitle */
.subtitle {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 30px;
  background: rgba(255,255,255,0.9);
  padding: 10px 22px;
  border-radius: 12px;
  display: inline-block;
}

/* Countdown Timer */
#timer {
  font-size: 56px;
  font-weight: 900;
  letter-spacing: 1px;
  background: rgba(0,0,0,0.78);
  color: #ffffff;
  padding: 22px 36px;
  border-radius: 16px;
}

/* Mobile scaling */
@media (max-width: 600px) {
  h1 { font-size: 30px; }
  .subtitle { font-size: 16px; }
  #timer { font-size: 38px; padding: 18px 24px; }
}
</style>

</head>

<body>

<div class="container">

<h1>IEFK ’26 Countdown</h1>

<div class="subtitle">
Program starts • 07 February 2026 • 09:00 AM IST
</div>

<div id="timer"></div>

</div>

<script>
const target = new Date("2026-02-07T09:00:00+05:30").getTime();

setInterval(function() {

  const now = new Date().getTime();
  const diff = target - now;

  const d = Math.floor(diff / (1000*60*60*24));
  const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
  const m = Math.floor((diff % (1000*60*60)) / (1000*60));
  const s = Math.floor((diff % (1000*60)) / 1000);

  document.getElementById("timer").innerHTML =
    d + " Days  " + h + " Hours  " + m + " Minutes  " + s + " Seconds";

}, 1000);
</script>

</body>
</html>
